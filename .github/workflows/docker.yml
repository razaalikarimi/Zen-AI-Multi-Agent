name: Docker Container Build & Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-containers:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: zen-ai/frontend:${{ github.sha }}

      - name: Build Gateway Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/gateway/Dockerfile
          push: false
          tags: zen-ai/gateway:${{ github.sha }}
