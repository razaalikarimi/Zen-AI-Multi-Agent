version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: zen-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - zen-prod-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: zen-prod-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - zen-prod-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    container_name: zen-prod-auth
    restart: always
    environment:
      - PORT=8001
      - MONGODB_URL=${MONGODB_AUTH_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - NODE_ENV=production
    networks:
      - zen-prod-network

  chat-service:
    build:
      context: ./backend
      dockerfile: services/chat/Dockerfile
    container_name: zen-prod-chat
    restart: always
    environment:
      - PORT=8002
      - MONGODB_URL=${MONGODB_CHAT_URL}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - NODE_ENV=production
    networks:
      - zen-prod-network

  billing-service:
    build:
      context: ./backend
      dockerfile: services/billing/Dockerfile
    container_name: zen-prod-billing
    restart: always
    environment:
      - PORT=8004
      - MONGODB_URL=${MONGODB_BILLING_URL}
      - AUTH_SERVICE=http://auth-service:8001
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - NODE_ENV=production
    networks:
      - zen-prod-network

  agent-service:
    build:
      context: ./backend
      dockerfile: services/agent/Dockerfile
    container_name: zen-prod-agent
    restart: always
    environment:
      - PORT=8003
      - MONGODB_URL=${MONGODB_AGENT_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CHAT_SERVICE=http://chat-service:8002
      - AUTH_SERVICE=http://auth-service:8001
      - GATEWAY_URL=${PUBLIC_GATEWAY_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - NODE_ENV=production
    networks:
      - zen-prod-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: zen-prod-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - AUTH_SERVICE=http://auth-service:8001
      - CHAT_SERVICE=http://chat-service:8002
      - AGENT_SERVICE=http://agent-service:8003
      - BILLING_SERVICE=http://billing-service:8004
      - FRONTEND_URL=${FRONTEND_URL}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - NODE_ENV=production
    networks:
      - zen-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zen-prod-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - zen-prod-network

volumes:
  redis_data:
  qdrant_data:

networks:
  zen-prod-network:
    driver: bridge

